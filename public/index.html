<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111318" />
    <title>TubeSwipe</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>TubeSwipe</h1>
      <nav>
        <button data-tab="stack" class="active"><span data-i18n="tab.stack">Stack</span> <span id="count" class="badge"></span></button>
        <button data-tab="sources" data-i18n="tab.sources">Sources</button>
        <button data-tab="history" data-i18n="tab.history">History</button>
        <button data-tab="duplicates"><span data-i18n="tab.duplicates">Duplicates</span> <span id="dup-count" class="badge"></span></button>
      </nav>
    </header>

    <main>
      <section id="tab-stack" class="tab active">
        <div id="deck"></div>
        <div id="empty" hidden>
          <p class="big" data-i18n="stack.empty">All swiped through.</p>
          <p id="empty-info" class="muted"></p>
          <button id="check-all" class="secondary" data-i18n="stack.checkAll">Check all sources now</button>
        </div>
        <div id="controls">
          <button id="btn-no" class="round no" data-i18n-title="btn.noTitle" data-i18n-aria="btn.no" title="No (←)" aria-label="No">✕</button>
          <button id="btn-undo" class="round small" data-i18n-title="btn.undoTitle" data-i18n-aria="btn.undo" title="Undo (Z)" aria-label="Undo" disabled>↶</button>
          <button id="btn-alt" class="round small alt" data-i18n-aria="btn.alt" title="Other format (↑)" aria-label="Other format">♪</button>
          <button id="btn-yes" class="round yes" data-i18n-aria="btn.yes" title="Yes (→)" aria-label="Yes">✓</button>
        </div>
        <p id="hint" class="muted"></p>
      </section>

      <section id="tab-sources" class="tab">
        <form id="add-form">
          <label>
            <span data-i18n="sources.url">Channel or playlist</span>
            <input id="add-url" type="url" data-i18n-placeholder="sources.placeholder" placeholder="https://www.youtube.com/@channel or …/playlist?list=…" required />
          </label>
          <div class="row">
            <label>
              <span data-i18n="sources.initial">Suggest existing videos</span>
              <select id="add-initial"></select>
            </label>
            <label>
              <span data-i18n="sources.preset">On yes, download as</span>
              <select id="add-preset"></select>
            </label>
          </div>
          <button type="submit" id="add-btn" data-i18n="sources.add">Add</button>
          <p id="add-msg" class="muted"></p>
        </form>
        <p class="muted note" data-i18n-html="sources.note"></p>
        <ul id="source-list" class="list"></ul>
      </section>

      <section id="tab-history" class="tab">
        <ul id="history-list" class="list"></ul>
      </section>

      <section id="tab-duplicates" class="tab">
        <div class="dup-head">
          <p id="dup-info" class="muted note"></p>
          <button id="dup-scan" class="secondary" data-i18n="dup.scan">Scan now</button>
        </div>
        <div class="dup-head">
          <p id="dup-trash" class="muted note"></p>
          <button id="dup-empty" class="secondary" data-i18n="dup.emptyTrash">Empty trash</button>
        </div>
        <ul id="dup-list" class="list"></ul>
      </section>
    </main>

    <div id="toast" hidden><span id="toast-text"></span><button id="toast-undo" data-i18n="btn.undo">Undo</button></div>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
