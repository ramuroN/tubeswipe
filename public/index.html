<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111318" />
    <title>TubeSwipe</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>TubeSwipe</h1>
      <nav>
        <button data-tab="stack" class="active">Stapel <span id="count" class="badge"></span></button>
        <button data-tab="sources">Quellen</button>
        <button data-tab="history">Verlauf</button>
        <button data-tab="duplicates">Doppelte <span id="dup-count" class="badge"></span></button>
      </nav>
    </header>

    <main>
      <section id="tab-stack" class="tab active">
        <div id="deck"></div>
        <div id="empty" hidden>
          <p class="big">Alles durchgeswipt.</p>
          <p id="empty-info" class="muted"></p>
          <button id="check-all" class="secondary">Jetzt alle Quellen prüfen</button>
        </div>
        <div id="controls">
          <button id="btn-no" class="round no" title="Nein (←)" aria-label="Nein">✕</button>
          <button id="btn-undo" class="round small" title="Zurück (Z)" aria-label="Zurück" disabled>↶</button>
          <button id="btn-alt" class="round small alt" title="Andere Art (↑)" aria-label="Andere Art">♪</button>
          <button id="btn-yes" class="round yes" title="Ja (→)" aria-label="Ja">✓</button>
        </div>
        <p id="hint" class="muted">→ Ja · ← Nein · ↑ <span id="hint-alt">Audio</span> · Z zurück · Leertaste Vorschau</p>
      </section>

      <section id="tab-sources" class="tab">
        <form id="add-form">
          <label>
            Kanal oder Playlist
            <input id="add-url" type="url" placeholder="https://www.youtube.com/@kanal oder …/playlist?list=…" required />
          </label>
          <div class="row">
            <label>
              Bestehende Videos vorschlagen
              <select id="add-initial">
                <option value="0">keine, nur neue</option>
                <option value="5">die letzten 5</option>
                <option value="10" selected>die letzten 10</option>
                <option value="25">die letzten 25</option>
                <option value="-1">alle</option>
              </select>
            </label>
            <label>
              Bei Ja laden als
              <select id="add-preset"></select>
            </label>
          </div>
          <button type="submit" id="add-btn">Hinzufügen</button>
          <p id="add-msg" class="muted"></p>
        </form>
        <p class="muted note">
          Private Playlists und «Später ansehen» kann MeTube ohne Login nicht lesen. Lege dafür eine
          <strong>nicht gelistete</strong> Playlist an und speichere Videos dort hinein.
        </p>
        <ul id="source-list" class="list"></ul>
      </section>

      <section id="tab-history" class="tab">
        <ul id="history-list" class="list"></ul>
      </section>

      <section id="tab-duplicates" class="tab">
        <div class="dup-head">
          <p id="dup-info" class="muted note"></p>
          <button id="dup-scan" class="secondary">Jetzt prüfen</button>
        </div>
        <div class="dup-head">
          <p id="dup-trash" class="muted note"></p>
          <button id="dup-empty" class="secondary">Papierkorb leeren</button>
        </div>
        <ul id="dup-list" class="list"></ul>
      </section>
    </main>

    <div id="toast" hidden><span id="toast-text"></span><button id="toast-undo">Zurück</button></div>

    <script src="app.js"></script>
  </body>
</html>
